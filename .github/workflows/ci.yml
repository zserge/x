name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet + build root demo
        run: |
          go vet main.go
          go build -o /dev/null main.go
      - name: vet + build TodoMVC example
        working-directory: examples/todomvc
        run: |
          go vet main.go
          go build -o /dev/null main.go
